name: Repository checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation integrity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hikingproject-local-ci]
    # Keep this required check name stable; it now also gates portable app checks.
    # Initial toolchain downloads and Swift compilation need more than five minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check documents and validator behaviour
        run: |
          python3 scripts/ci/check_docs.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          git diff --check HEAD^ HEAD
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check React workspace
        run: |
          npm ci
          npm run check:web
      - name: Verify native Swift prerequisites
        # The owner builds these into the unprivileged runner image; PRs get no sudo.
        run: |
          missing=0
          for tool in file gpg gunzip tar clang pkg-config; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::Runner image is missing $tool; see docs/guides/CI.md"
              missing=1
            fi
          done
          test "$missing" -eq 0
          pkg-config --exists sqlite3 || { echo '::error::Install libsqlite3-dev in the runner image'; exit 1; }
      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: '6.2.1'
      - name: Test portable Swift and SQLite
        run: swift test --scratch-path .build/ci --disable-automatic-resolution --jobs 2

  contribution:
    name: Contribution policy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hikingproject-local-ci]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check PR, Issue and commit conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/check_pr.py
